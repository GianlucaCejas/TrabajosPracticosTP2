<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Manejando backend</title>
  <link rel="stylesheet" href="public/styles.css">
</head>
<body>
  <h1>Gestión de conceptos</h1>

  <section>
    <h2>Agregar concepto</h2>
    <form method="POST" id="conceptoForm">
      <label>Introducir nombre:</label>
      <input type="text" id="nombreConcepto" name="nombreConcepto" required>
      <br><br>
      <label>Descripción:</label>
      <textarea id="descripcion" name="descripcion" required></textarea>
      <br><br>
      <button type="submit">Agregar</button>
    </form>
  </section>

  <section>
    <h2>Listado de conceptos</h2>
    <ul id="listaConceptos"></ul>
    <button id="eliminarTodoBtn">Eliminar todos los conceptos</button>
  </section>

  <script src="public/script.js"></script>
</body>
</html>
